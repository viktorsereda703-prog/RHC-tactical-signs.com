    ];

    const imageBase = "./images/";
    let current = 0;
    let score = 0;

    function loadQuestion() {
      const q = questions[current];
      const imageSrc = q.image.match(/^https?:\/\//) ? q.image : imageBase + q.image;
      const questionImage = document.getElementById("questionImage");
      questionImage.src = imageSrc;
      questionImage.alt = q.description;
      questionImage.onerror = () => {
        questionImage.alt = "Зображення не знайдено";
        questionImage.src = "";
      };
      document.getElementById("options").innerHTML = "";
      q.options.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "option";
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(opt, q.description);
        document.getElementById("options").appendChild(btn);
      });
      document.getElementById("result").innerText = "";
    }

    function checkAnswer(selected, correct) {
      if (selected === correct) {
        score++;
        document.getElementById("result").innerText = "✅ Правильно!";
      } else {
        score = Math.max(0, score - 1);
        document.getElementById("result").innerText = "❌ Неправильно.";
      }
      document.getElementById("score").innerText = "Очки: " + score;
      setTimeout(nextQuestion, 1000); // через 1 секунду переходимо до наступного питання
    }

    function nextQuestion() {
      current++;
      if (current < questions.length) {
        loadQuestion();
      } else {
        document.getElementById("game").innerHTML =
          "<h2>Гру завершено!</h2><p>Ваш рахунок: " + score + "</p>" +
          "<button class=\"option\" onclick=\"restartGame()\">Грати ще раз</button>";
      }
    }

    function restartGame() {
      current = 0;
      score = 0;
      document.getElementById("score").innerText = "Бали: 0";
      document.getElementById("game").innerHTML =
        '<p id="score">Бали: 0</p><img id="questionImage" src="" alt="Тактичний знак" loading="lazy"><div id="options"></div><p id="result"></p>';
      loadQuestion();
    }

    loadQuestion();
  </script>
